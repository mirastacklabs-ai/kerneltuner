# sysctls that bpftune tunes at runtime (data, not rules). See rules/README.md.
# Source: https://github.com/oracle/bpftune README and docs (net-buffer, TCP buffer, UDP buffer,
# TCP connection tuners), fetched 2026-11-16. Writing any of these by hand disables the
# colliding tuner until bpftune restarts. The ipfrag and neighbour-table tuner sysctl names
# were not verified and are omitted.
sysctls:
  - net.ipv4.tcp_rmem
  - net.ipv4.tcp_wmem
  - net.ipv4.tcp_mem
  - net.core.netdev_max_backlog
  - net.core.flow_limit_cpu_bitmap
  - net.core.netdev_budget
  - net.core.netdev_budget_usecs
  - net.core.rmem_default
  - net.core.rmem_max
  - net.ipv4.tcp_congestion_control
