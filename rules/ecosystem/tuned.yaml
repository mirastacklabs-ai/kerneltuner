# tuned profiles and the sysctls they set (data, not rules). See rules/README.md.
# Source: https://github.com/redhat-performance/tuned/tree/master/profiles (master, fetched 2026-11-16).
# Profiles vary by tuned version and distro. Only [sysctl] entries are listed; cmdline,
# cpu, vm-dirty and other plugin settings are not sysctl rules and are omitted.
profiles:
  throughput-performance:
    sysctl:
      vm.swappiness: 10
      net.core.somaxconn: 2048   # tuned writes ">2048": a floor, not a cap
  latency-performance:
    sysctl:
      vm.swappiness: 10
  network-latency:
    include: latency-performance
    sysctl:
      net.core.busy_read: 50
      net.core.busy_poll: 50
      net.ipv4.tcp_fastopen: 3
      kernel.numa_balancing: 0
      kernel.hung_task_timeout_secs: 600
      kernel.nmi_watchdog: 0
      vm.stat_interval: 10
      kernel.timer_migration: 0
  network-throughput:
    include: throughput-performance
    sysctl:
      net.ipv4.tcp_notsent_lowat: 131072
      net.ipv4.tcp_slow_start_after_idle: 0
      net.ipv4.tcp_rmem: "4096 131072 16777216"
      net.ipv4.tcp_wmem: "4096 16384 16777216"
