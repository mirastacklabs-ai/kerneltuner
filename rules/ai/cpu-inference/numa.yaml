- id: ai.cpu.numa-binding
  title: Bind CPU inference instances to one NUMA node
  kind: runtime
  param: numactl
  domain: ai
  applies:
    when: 'hasApp("pytorch") && len(facts.NUMA) > 1 && accelCount("") == 0'
  risk: low
  rationale: >-
    On a multi-socket host, memory touched from the other socket crosses the inter-socket link, which costs
    bandwidth and latency for memory-bound inference. The PyTorch CPU tuning guide says deep-learning workloads
    generally do better without cross-NUMA access, recommends one inference instance per socket for throughput, and
    gives numactl --cpunodebind=N --membind=N to pin a process to node N's cores and memory. Binding is a launch
    decision, so kerneltuner cannot see whether it was done; this is advice for every CPU-only PyTorch host with
    more than one NUMA node.
  advice: >-
    This host has {{len .facts.NUMA}} NUMA nodes and no accelerator. Run one inference instance per node, each
    launched as `numactl --cpunodebind=N --membind=N <your launcher>` (N is a node id from
    /sys/devices/system/node). With a pinned instance, size its thread count to that node's physical cores (see
    app.pytorch.cpu-threading). llama.cpp has its own flag, covered by app.llama_cpp.numa.
  verify: "each instance's threads run only on its node's CPUs and its memory is allocated on that node"
  sources:
    - https://docs.pytorch.org/tutorials/recipes/recipes/tuning_guide.html
    - https://man7.org/linux/man-pages/man8/numactl.8.html
  tests:
    - fixture: pytorch-cpu-amx-2s
      expect: { status: recommend }
    - fixture: cpu-amx-2s
      expect: { status: not-applicable }
    - fixture: gpu-8xh100
      expect: { status: not-applicable }
