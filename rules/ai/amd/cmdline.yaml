- id: ai.amd.iommu_pt
  title: IOMMU passthrough for ROCm hosts
  kind: cmdline
  param: iommu
  domain: ai
  applies:
    when: 'accelCount("amd") > 0'
  recommend: '"pt"'
  compare: eq
  reboot: true
  risk: medium
  rationale: >-
    AMD's MI300X acceptance guide requires iommu=pt on the kernel command line, and the SGLang AMD guide
    lists it as host setup. Passthrough keeps host-owned devices in identity-mapped domains so GPU and NIC DMA
    skips IOMMU translation; the IOMMU stays available for VFIO. The cost is weaker DMA isolation between
    devices and host memory. Needs a reboot.
  advice: >-
    Add iommu=pt to GRUB_CMDLINE_LINUX in /etc/default/grub, regenerate the bootloader config, reboot.
  verify: "/proc/cmdline contains iommu=pt"
  sources:
    - https://rocm.docs.amd.com/en/latest/how-to/system-optimization/mi300x.html
    - https://docs.sglang.io/docs/hardware-platforms/amd_gpu.md
  tests:
    - fixture: gpu-8xmi300x
      expect: { status: recommend, proposed: pt }
    - fixture: ai-amd-tuned
      expect: { status: ok }
    - fixture: gpu-8xh100
      expect: { status: not-applicable }

- id: ai.amd.amd_iommu_on
  title: amd_iommu=on on AMD-CPU ROCm hosts
  kind: cmdline
  param: amd_iommu
  domain: ai
  applies:
    when: 'accelCount("amd") > 0 and facts.CPU.Vendor == "AuthenticAMD"'
  recommend: '"on"'
  compare: eq
  reboot: true
  risk: medium
  rationale: >-
    The MI300X acceptance check passes only if the cmdline contains amd_iommu=on or intel_iommu=on (the one
    matching the host CPU) together with iommu=pt and pci=realloc=off. This rule covers hosts with AMD CPUs;
    the Intel-CPU variant is ai.amd.intel_iommu_on. The AMD page gives no kernel-version history for the option.
  advice: Add amd_iommu=on to GRUB_CMDLINE_LINUX, regenerate the bootloader config, reboot.
  verify: "/proc/cmdline contains amd_iommu=on"
  sources:
    - https://rocm.docs.amd.com/en/latest/how-to/system-optimization/mi300x.html
  tests:
    - fixture: ai-amd-xeon-host
      expect: { status: not-applicable }
    - fixture: ai-amd-tuned
      expect: { status: ok }
    - fixture: ai-amd-low-limits
      expect: { status: ok }

- id: ai.amd.intel_iommu_on
  title: intel_iommu=on on Intel-CPU ROCm hosts
  kind: cmdline
  param: intel_iommu
  domain: ai
  applies:
    when: 'accelCount("amd") > 0 and facts.CPU.Vendor == "GenuineIntel"'
  recommend: '"on"'
  compare: eq
  reboot: true
  risk: medium
  rationale: >-
    Intel-CPU variant of the MI300X acceptance requirement (amd_iommu=on or intel_iommu=on). The Linux
    default for intel_iommu is off unless the kernel was built with CONFIG_INTEL_IOMMU_DEFAULT_ON, so it is
    commonly missing.
  advice: Add intel_iommu=on to GRUB_CMDLINE_LINUX, regenerate the bootloader config, reboot.
  verify: "/proc/cmdline contains intel_iommu=on"
  sources:
    - https://rocm.docs.amd.com/en/latest/how-to/system-optimization/mi300x.html
  tests:
    - fixture: ai-amd-xeon-host
      expect: { status: recommend, proposed: "on" }
    - fixture: gpu-8xmi300x
      expect: { status: not-applicable }

- id: ai.amd.pci_realloc_off
  title: pci=realloc=off for MI300X hosts
  kind: cmdline
  param: pci
  domain: ai
  applies:
    when: 'accelCount("amd") > 0'
  recommend: '"realloc=off"'
  compare: eq
  reboot: true
  risk: medium
  rationale: >-
    Both the MI300X acceptance guide and the SGLang AMD guide require pci=realloc=off. The sources give no
    reason; the option stops the kernel from reassigning PCI resources, which keeps the firmware BAR layout.
    If you already pass other pci= options, merge them into one comma-separated pci= value that includes
    realloc=off.
  advice: Add pci=realloc=off to GRUB_CMDLINE_LINUX (merge with any existing pci= options), reboot.
  verify: "/proc/cmdline contains realloc=off in its pci= option"
  sources:
    - https://rocm.docs.amd.com/en/latest/how-to/system-optimization/mi300x.html
    - https://docs.sglang.io/docs/hardware-platforms/amd_gpu.md
  tests:
    - fixture: gpu-8xmi300x
      expect: { status: recommend, proposed: realloc=off }
    - fixture: ai-amd-tuned
      expect: { status: ok }
    - fixture: gaudi3-8x
      expect: { status: not-applicable }
