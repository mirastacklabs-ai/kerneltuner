description: "Bare-metal MariaDB 11 under systemd: 1024 open files, swappiness 60, mq-deadline on NVMe and bfq on a rotational disk"
synthetic: true
extends: base-linux
files:
  "proc/2200/cgroup": "0::/system.slice/mariadb.service\n"
  "proc/2200/cmdline": "/usr/sbin/mariadbd\u0000"
  "proc/2200/comm": "mariadbd\n"
  "proc/2200/fd/0": ""
  "proc/2200/fd/1": ""
  "proc/2200/fd/2": ""
  "proc/2200/limits": "Limit                     Soft Limit           Hard Limit           Units\nMax cpu time              unlimited            unlimited            seconds\nMax file size             unlimited            unlimited            bytes\nMax processes             514380               514380               processes\nMax open files            1024                1024                files     \nMax locked memory         8388608              8388608              bytes     \n"
  "sys/block/nvme0n1/queue/rotational": "0\n"
  "sys/block/nvme0n1/queue/scheduler": "none [mq-deadline] kyber bfq\n"
  "sys/block/nvme0n1/queue/read_ahead_kb": "128\n"
  "sys/block/nvme0n1/queue/nr_requests": "256\n"
  "sys/block/sda/queue/rotational": "1\n"
  "sys/block/sda/queue/scheduler": "none mq-deadline kyber [bfq]\n"
  "sys/block/sda/queue/read_ahead_kb": "128\n"
  "sys/block/sda/queue/nr_requests": "256\n"
